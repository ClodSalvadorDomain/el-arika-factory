<script>
  /* Language and direction before first paint, so Arabic never flashes LTR. */
  (function () {
    var l = 'en';
    try { l = localStorage.getItem('eaf-lang') || (navigator.language || '').slice(0, 2) === 'ar' && 'ar' || 'en'; } catch (e) {}
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>
